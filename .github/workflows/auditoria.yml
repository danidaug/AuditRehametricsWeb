name: Auditoría web

on:
  # 9:00 Europe/Madrid (hora peninsular, UTC+2 en verano) = 07:00 UTC, de lunes a viernes.
  # Nota: GitHub Actions usa UTC fijo, por lo que en invierno (CET) se ejecutará a las 8:00 AM locales.
  schedule:
    - cron: "0 7 * * 1-5"
  # Permite lanzarla manualmente desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditar:
    name: Auditar rehametrics.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias y Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar auditoría
        run: python auditor_web.py

      # Se omite mientras no existan los secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
      - name: Enviar resultado a Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          set -euo pipefail
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"

          if [ -f resumen.txt ]; then
            curl -fsS -X POST "${API}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text@resumen.txt" > /dev/null
          else
            curl -fsS -X POST "${API}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=AUDITORIA WEB - ${GITHUB_REPOSITORY}
          La auditoria finalizo sin generar resumen. Revisa la ejecucion: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
          fi

          if [ -f informe_auditoria_web.pdf ]; then
            curl -fsS -X POST "${API}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@informe_auditoria_web.pdf" \
              -F "caption=Informe PDF de la auditoria" > /dev/null
          fi

          # Primera pantalla de la pagina principal, en alta resolucion
          if [ -f capturas/inicio_primera.png ]; then
            curl -fsS -X POST "${API}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@capturas/inicio_primera.png" \
              -F "caption=Primera pantalla - Inicio (alta resolucion 2x)" > /dev/null
          fi

          # Captura completa de cada una de las paginas auditadas
          for f in capturas/*_completa.png; do
            [ -e "$f" ] || continue
            nombre=$(basename "$f" _completa.png)
            curl -fsS -X POST "${API}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${f}" \
              -F "caption=Captura completa - ${nombre}" > /dev/null
          done

      - name: Subir informe, resumen y capturas ligeras
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-auditoria-${{ github.run_number }}
          # Solo lo ligero: las capturas completas en PNG pesan ~50 MB por ejecucion
          # y GitHub solo guarda 500 MB de artifacts. Van a Telegram a toda resolucion.
          path: |
            informe_auditoria_web.pdf
            resumen.txt
            capturas/*_pdf.jpg
          if-no-files-found: warn
          retention-days: 90
